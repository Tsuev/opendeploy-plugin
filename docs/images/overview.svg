<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">OpenDeploy: от сайта к публикации</title>
  <desc id="desc">Агент проверяет и собирает сайт, затем OpenDeploy публикует его после подтверждения.</desc>
  <style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style>
  <rect width="1200" height="300" rx="28" fill="#050505"/>
  <path d="M0 238H1200M236 0V300" stroke="#333" stroke-width="1"/>
  <g transform="translate(-3 10) scale(.43)" fill="#fff">
    <path d="M165 142H404L563 256V425L404 546H165V537L469 347L165 174Z"/>
    <path d="M165 208L285 277V428L165 506Z"/>
  </g>
  <text x="276" y="113" fill="#fff" font-size="48" font-weight="800" letter-spacing="-2">OpenDeploy</text>
  <text x="278" y="154" fill="#a9a9a9" font-size="22">От проекта до публичного сайта</text>
  <text x="278" y="199" fill="#f0f0f0" font-size="17">Проверка → сборка → публикация</text>
  <path d="M989 61h118l-39-29m39 29-39 29" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter"/>
  <text x="278" y="272" fill="#aaa" font-size="15" letter-spacing="1">АГЕНТ ГОТОВИТ</text>
  <text x="645" y="272" fill="#aaa" font-size="15" letter-spacing="1">ВЫ ПОДТВЕРЖДАЕТЕ</text>
  <text x="1000" y="272" fill="#fff" font-size="15" font-weight="700" letter-spacing="1">САЙТ ОНЛАЙН</text>
</svg>
