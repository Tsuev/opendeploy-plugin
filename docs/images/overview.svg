<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">OpenDeploy: путь от сайта до публикации</title>
  <desc id="desc">Проект сайта проходит проверку агентом, затем публикуется через OpenDeploy.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1830"/><stop offset="1" stop-color="#163d52"/></linearGradient>
    <style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} .label{fill:#fff;font-size:24px;font-weight:700} .sub{fill:#b8d0db;font-size:16px}.arrow{stroke:#69d8bd;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}</style>
  </defs>
  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <circle cx="1055" cy="34" r="128" fill="#64d7b5" opacity=".07"/>
  <circle cx="1125" cy="265" r="160" fill="#8ac5ff" opacity=".07"/>
  <text x="48" y="55" fill="#79e7c7" font-family="Inter,-apple-system,sans-serif" font-size="18" font-weight="700" letter-spacing="2">OPENDEPLOY</text>
  <rect x="48" y="88" width="300" height="160" rx="22" fill="#ffffff" opacity=".1" stroke="#ffffff" stroke-opacity=".18"/>
  <rect x="78" y="117" width="68" height="72" rx="8" fill="#76d9be"/>
  <path d="M94 138h36M94 150h36M94 162h25" stroke="#123b48" stroke-width="4" stroke-linecap="round"/>
  <text class="label" x="162" y="148">Ваш сайт</text><text class="sub" x="162" y="178">Исходники и сборка</text>
  <path class="arrow" d="M363 168h42m-12-11 12 11-12 11"/>
  <rect x="420" y="88" width="342" height="160" rx="22" fill="#ffffff" opacity=".1" stroke="#ffffff" stroke-opacity=".18"/>
  <circle cx="472" cy="152" r="29" fill="#76d9be"/>
  <path d="m459 152 9 9 17-19" stroke="#123b48" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label" x="515" y="148">ИИ-агент</text><text class="sub" x="515" y="178">Проверяет и готовит</text>
  <path class="arrow" d="M777 168h42m-12-11 12 11-12 11"/>
  <rect x="834" y="88" width="318" height="160" rx="22" fill="#76d9be"/>
  <circle cx="886" cy="151" r="29" fill="#164054"/>
  <path d="M874 158h24m-20-9 8-9 8 9" stroke="#76d9be" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="930" y="148" fill="#123b48" font-family="Inter,-apple-system,sans-serif" font-size="24" font-weight="700">OpenDeploy</text>
  <text x="930" y="178" fill="#245966" font-family="Inter,-apple-system,sans-serif" font-size="16">Публикует сайт</text>
</svg>
