<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="268" viewBox="0 0 1200 268" role="img" aria-labelledby="title desc">
  <title id="title">Пять этапов публикации OpenDeploy</title>
  <desc id="desc">Проверка проекта, сборка, вход, подтверждение и публикация.</desc>
  <style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.number{font-size:42px;font-weight:800;fill:#fff}.label{font-size:20px;font-weight:700;fill:#fff}.detail{font-size:15px;fill:#aaa}</style>
  <rect width="1200" height="268" rx="28" fill="#050505"/>
  <path d="M42 60H1158" stroke="#333" stroke-width="1"/>
  <text x="42" y="42" fill="#fff" font-family="Inter,-apple-system,sans-serif" font-size="17" font-weight="700" letter-spacing="2">КАК ЭТО РАБОТАЕТ</text>
  <g transform="translate(42 82)"><rect width="207" height="146" rx="14" fill="#111" stroke="#555"/><text class="number" x="18" y="56">01</text><text class="label" x="18" y="98">Проверка</text><text class="detail" x="18" y="123">Проект и SEO</text></g>
  <g transform="translate(269 82)"><rect width="207" height="146" rx="14" fill="#111" stroke="#555"/><text class="number" x="18" y="56">02</text><text class="label" x="18" y="98">Сборка</text><text class="detail" x="18" y="123">Статические файлы</text></g>
  <g transform="translate(496 82)"><rect width="207" height="146" rx="14" fill="#111" stroke="#555"/><text class="number" x="18" y="56">03</text><text class="label" x="18" y="98">Вход</text><text class="detail" x="18" y="123">Ссылка и код</text></g>
  <g transform="translate(723 82)"><rect width="207" height="146" rx="14" fill="#111" stroke="#555"/><text class="number" x="18" y="56">04</text><text class="label" x="18" y="98">Подтверждение</text><text class="detail" x="18" y="123">Адрес и файлы</text></g>
  <g transform="translate(950 82)"><rect width="208" height="146" rx="14" fill="#fff"/><text x="18" y="56" fill="#000" font-family="Inter,-apple-system,sans-serif" font-size="42" font-weight="800">05</text><text x="18" y="98" fill="#000" font-family="Inter,-apple-system,sans-serif" font-size="20" font-weight="700">Публикация</text><text x="18" y="123" fill="#555" font-family="Inter,-apple-system,sans-serif" font-size="15">Ссылка и статус</text></g>
</svg>
